<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .t  { font-size: 60px; font-weight: 700; fill: #f8fafc; letter-spacing: 1px; }
    .tg { font-size: 26px; font-weight: 600; fill: #34d399; }
    .sb { font-size: 19px; fill: #94a3b8; }
    .chip { font-size: 16px; font-weight: 600; fill: #e2e8f0; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#10b981"/>
