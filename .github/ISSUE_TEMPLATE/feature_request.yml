name: ✨ 功能请求
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请说明**动机**与**期望方案**，附上使用场景示例会更容易被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 动机 / 解决的问题
      description: 你希望解决什么问题？当前有什么不便？
      placeholder: "例如：大规模库存下求解太慢，希望支持……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的行为 / 界面 / API 形态，可附命令行或 JSON 示例
      placeholder: |
        besq --xxx ...
        或：GUI 计算器页新增……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - CLI
        - Web GUI
        - 算法内核 / 插件
        - 数据 / Profile
        - 构建 / 工程化
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查清单
      options:
        - label: 已搜索 Issues / 文档，无重复请求
        - label: 已阅读 docs/architecture-overview.md，了解现有架构
